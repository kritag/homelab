# Adapted from the official file:
#   https://github.com/immich-app/immich/releases/latest/download/docker-compose.yml
#
# Deviations from upstream, all deliberate:
#   - immich-machine-learning removed (no face recognition / semantic search wanted).
#     Also disable it in Administration > Settings > Machine Learning after first boot,
#     or the server keeps queuing jobs for a service that isn't there.
#   - `restart: unless-stopped` instead of `always`, matching the other stacks — with
#     `always`, a docker daemon restart during the nightly backup would bring containers
#     up while the stack is meant to be stopped.
#   - IMMICH_VERSION pinned to a release rather than the moving `v3` tag. Immich ships
#     breaking changes between majors; read the release notes before bumping.
#
# The database image is NOT interchangeable with vanilla postgres — it carries the
# vectorchord/pgvectors extensions Immich needs. Both it and valkey are digest-pinned
# upstream; leave those alone.

name: immich

services:
  immich-server:
    container_name: immich_server
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION}
    volumes:
      - ${UPLOAD_LOCATION}:/data
      - /etc/localtime:/etc/localtime:ro
    env_file:
      - .env
    ports:
      - '2283:2283'
    depends_on:
      - redis
      - database
    restart: unless-stopped
    healthcheck:
      disable: false

  redis:
    container_name: immich_redis
    image: docker.io/valkey/valkey:9@sha256:8e8d64b405ce18f41b8e5ee20aa4687a8ed0022d1298f2ce31cdcf3a76e09411
    healthcheck:
      test: redis-cli ping || exit 1
    restart: unless-stopped

  database:
    container_name: immich_postgres
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_INITDB_ARGS: '--data-checksums'
    volumes:
      - ${DB_DATA_LOCATION}:/var/lib/postgresql/data
    shm_size: 128mb
    restart: unless-stopped
    healthcheck:
      disable: false
